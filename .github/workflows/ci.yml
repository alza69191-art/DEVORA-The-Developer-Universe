name: DEVORA CI

on:
  push:
    branches: [main, phase-1-platform-core]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:security
      - run: npm run test:git
      - run: npm run typecheck
      - run: npm run build
